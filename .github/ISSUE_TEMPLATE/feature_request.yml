name: Feature request
description: Suggest a focused improvement to Agent Firewall.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful solution and its tradeoffs.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Could this change a guarantee, capability, trust boundary, or audit behavior?
    validations:
      required: true
