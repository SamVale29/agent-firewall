name: Security

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.mod
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: "1.25.x"
          cache-dependency-path: go.mod
          go-package: ./...
