version: 1

mode: auto

filesystem:
  default: ask
  allow:
    - "./**"
  read_only:
    - "../shared/**"
  deny:
    - "~/.ssh/**"
    - "~/.gnupg/**"
    - "~/.aws/**"
    - "~/.config/gcloud/**"
    - "~/.kube/**"
    - "~/.git-credentials"

network:
  default: ask
  allow:
    - "github.com"
    - "api.github.com"
    - "registry.npmjs.org"
  deny:
    - "169.254.169.254"

shell:
  default: allow
  ask:
    - "rm"
    - "git reset"
    - "git clean"
    - "docker"
    - "podman"
    - "kubectl"
    - "chmod"
    - "chown"
    - "dd"
    - "mkfs"
    - "curl | sh"
    - "wget | sh"
    - "terraform destroy"
  deny:
    - "sudo"
    - "shutdown"
    - "reboot"

environment:
  inherit:
    - "PATH"
    - "HOME"
    - "LANG"
    - "TERM"
    - "TZ"
    - "USER"
    - "SHELL"
  deny:
    - "*_SECRET"
    - "*_TOKEN"
    - "*_PASSWORD"
    - "*_PRIVATE_KEY"
    - "*_API_KEY"
    - "AWS_SECRET_ACCESS_KEY"
    - "GITHUB_TOKEN"
    - "OPENAI_API_KEY"
    - "ANTHROPIC_API_KEY"

audit:
  enabled: true
  format: jsonl

sandbox:
  backend: auto
  container:
    image: "ubuntu:24.04"
    network: policy
